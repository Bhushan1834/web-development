<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background: #2b5797;
      color: #fff;
      padding: 15px;
      text-align: center;
    }
    nav {
      background: #333;
      padding: 10px;
    }
    nav a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
    }
    main {
      padding: 20px;
    }
    footer {
      background: #111;
      color: #fff;
      text-align: center;
      padding: 10px;
      position: fixed;
      width: 100%;
      bottom: 0;
    }
  </style>
</head>
<body>

<header>
  <h1>Welcome!</h1>
  <p>Improved Website Example</p>
</header>

<nav>
  <a href="#home">Home</a>
  <a href="#features">Features</a>
  <a href="#contact">Contact</a>
</nav>

<main>
  <section id="home">
    <h2>About This Site</h2>
    <p>Describe what this website does here.</p>
  </section>

  <section id="features">
    <h2>Features</h2>
    <ul>
      <li>Fast and responsive</li>
      <li>SEO friendly</li>
      <li>Modern design</li>
    </ul>
  </section>
  
  <section id="contact">
    <h2>Contact Us</h2>
    <form>
      <input type="text" placeholder="Your Name" required /><br><br>
      <input type="email" placeholder="Your Email" required /><br><br>
      <button type="submit">Submit</button>
    </form>
  </section>
</main>

<footer>
    &copy; 2025 Your Company Name
</footer>

</body>
</html>
