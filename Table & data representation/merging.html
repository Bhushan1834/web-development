<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merging Cells </title>
</head>
<body>
    <h1>Col span</h1>
    <table border="2">
        <tr>
            <th colspan="6">Fruit Store</th>
        </tr>
        <tr>
            <td>Apple</td>
            <td>120</td>
        </tr>
        <tr>
            <td>Banana</td>
            <td>60</td>
        </tr>
        <tr>
            <td>Apple</td>
            <td>120</td>
        </tr>
        <tr>
            <td>Banana</td>
            <td>60</td>
        </tr>

    </table>
    <h2>Row span</h2>
    <table border="1">
        <tr>
            <th rowspan="4">Fruit</th>
            <td>appple</td>
        </tr>
        <tr>
            <td>Mango</td>
        </tr>
        <tr>
            <td>Banana</td>
        </tr>
        <tr>
            <td>Orange</td>
        </tr>
    </table>
</body>
</html>
