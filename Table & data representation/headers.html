<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Header</title>
</head>
<body>
    <table border="1">
        <thead>
            <tr>
                <th>Fruit</th>
                <th>Price</th>
            </tr>
        </thead>
 

    <tbody>
            <tr>
               <td>Apple</td>
               <td>120</td>
            </tr>

            <tr>
              <td>Banana</td>
              <td>150</td>

            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Quantity: 2</td>
                <td>270</td>

            </tr> 
        </tfoot>
    </table>
    
</body>
</html>
